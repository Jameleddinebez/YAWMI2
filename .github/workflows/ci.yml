name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests (sequence-engine + domain)
        run: ./gradlew :sequence-engine:test :domain:test --stacktrace

      - name: Unit tests (app)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            sequence-engine/build/reports/tests
            domain/build/reports/tests
            app/build/reports/tests

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yawmi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
